<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>12WASHERE | Promotional Banner</title>
  <style>
    @font-face {
      font-family: "Barlow Condensed";
      src: url("barlow-condensed-800.woff2") format("woff2");
      font-weight: 800;
      font-display: swap;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("space-mono-700.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --cream: #eeeede;
      --accent: #ef7848;
      --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      --mono: "Space Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #101411;
      color: var(--cream);
    }
    .canvas {
      width: min(100%, 1920px);
      container-type: inline-size;
    }
    .banner {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #111612;
    }
    .scene, .banner::before {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .scene {
      z-index: -2;
      object-fit: cover;
    }
    .banner::before {
      content: "";
      z-index: -1;
      background:
        linear-gradient(90deg, #101411f0 0%, #101411ab 25%, #10141126 41%, transparent 58%),
        linear-gradient(0deg, #0a0f0acc 0%, transparent 23%);
    }
    .frame {
      position: absolute;
      inset: 2.45cqw;
      border: 1px solid #eeeede36;
      pointer-events: none;
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: 1.7cqw;
      height: 1.7cqw;
      border: solid var(--accent);
    }
    .frame::before {
      top: -1px;
      left: -1px;
      border-width: .14cqw 0 0 .14cqw;
    }
    .frame::after {
      right: -1px;
      bottom: -1px;
      border-width: 0 .14cqw .14cqw 0;
    }
    .copy {
      position: absolute;
      inset: 5.55cqw auto 5.5cqw 5.65cqw;
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: start;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .9cqw;
      font: 800 2.85cqw/.82 var(--display);
      letter-spacing: .045em;
    }
    .brand-mark {
      position: relative;
      width: 3.65cqw;
      height: 3.65cqw;
      display: grid;
      place-items: center;
      border: .10cqw solid var(--accent);
      color: var(--accent);
      font-size: 2.72cqw;
      letter-spacing: 0;
      transform: rotate(-5deg);
    }
    .brand-mark::after {
      content: "↗";
      position: absolute;
      top: -.58cqw;
      right: -.34cqw;
      padding-inline: .15cqw;
      background: #131613;
      font: 700 .92cqw/1 var(--mono);
    }
    .brand-game {
      display: block;
      margin-top: .46cqw;
      color: #bac3b2;
      font: 700 .93cqw/1.1 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      align-self: center;
      margin: 0;
      font: 800 6.62cqw/.84 var(--display);
      letter-spacing: -.025em;
      text-transform: uppercase;
      text-shadow: 0 .12cqw .7cqw #080b08aa;
    }
    h1 span { color: #ff9369; }
    .actions {
      display: flex;
      gap: .7cqw;
    }
    .action {
      display: inline-flex;
      align-items: center;
      gap: 1.5cqw;
      border: .09cqw solid #ef7848a8;
      padding: .85cqw 1.2cqw .91cqw;
      background: #141a15e6;
      color: var(--cream);
      text-decoration: none;
      font: 700 1.53cqw/1 var(--mono);
    }
    .action-arrow { color: #ff9369; }
    .action:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .discord {
      gap: 1cqw;
      padding: .45cqw .95cqw;
      border-color: #9599d8a8;
      background: #1a1d2aef;
      font-size: 1.15cqw;
    }
    .discord-label {
      display: block;
      margin-bottom: .24cqw;
      color: #c0c3ff;
      font-size: .79cqw;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .discord .action-arrow { color: #c0c3ff; }
  </style>
</head>
<body>
  <main class="canvas">
    <article class="banner" aria-label="12WASHERE promotional banner">
      <img class="scene" src="campsite.png" alt="At a woodland campsite at dusk, two survivors with rifles watch the treeline beside a tent, campfire, and off-road pickup.">
      <div class="frame" aria-hidden="true"></div>
      <div class="copy">
        <div class="brand" role="img" aria-label="12WASHERE, a Project Zomboid server">
          <span class="brand-mark" aria-hidden="true">12</span>
          <div aria-hidden="true">WASHERE<span class="brand-game">Project Zomboid Server</span></div>
        </div>
        <h1>Knox has<br>fallen.<br><span>You’re not<br>done yet.</span></h1>
        <div class="actions">
          <a class="action" href="https://12washere.pro/">12washere.pro <span class="action-arrow" aria-hidden="true">↗</span></a>
          <a class="action discord" href="https://discord.gg/3qPv6cNpSZ">
            <span><span class="discord-label">Join Discord</span>discord.gg/3qPv6cNpSZ</span>
            <span class="action-arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </div>
    </article>
  </main>
</body>
</html>

<!--
Background generated with the built-in imagegen tool.

Prompt
Create the full-bleed background illustration for a 16:9 promotional banner for a Project Zomboid multiplayer server. Compose it like gritty hand-painted survival-game key art, seen from an elevated three-quarter angle. A small woodland campsite in rural Kentucky at late dusk, with exactly two distinct survivors, visibly holding rifles at low ready and watching different parts of the treeline. Put both survivors, a pitched weathered olive canvas tent with a warm opening, a small amber campfire, and a mud-splashed 1990s off-road pickup with supplies secured to its rack in the right 55% of the frame, arranging them in clear, separate silhouettes. Give the survivors practical mismatched workwear and visible faces or profiles. Keep the entire vehicle within frame with space to its right, place the main subjects in the central vertical 75%, and keep the bottom edges expendable for a wide crop. Campfire light reveals the figures, tent, stones and some supplies, while muted cool green forest shadows and faint blue-gray twilight give the scene depth. Tension and camaraderie, grounded proportions, visible brushwork and subtle grain. Keep the left 45% naturally dark and low-detail with shadowed forest and subdued ground so a designer can overlay large cream text. No typography, logos, watermarks, UI, gore or muzzle flashes.
-->
