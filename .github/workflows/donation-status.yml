name: Update public donation data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/donation-status.yml
      - scripts/query-donations.py
  schedule:
    - cron: '1-56/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-donation-data
  cancel-in-progress: false

jobs:
  query:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read public Saweria widget data
        run: python3 scripts/query-donations.py "$RUNNER_TEMP/donation-status.json"
      - name: Publish the donation snapshot on its data branch
        shell: bash
        run: |
          ref=refs/heads/donation-status
          previous=$(git ls-remote origin "$ref" | cut -f1)
          blob=$(git hash-object -w "$RUNNER_TEMP/donation-status.json")
          tree=$(printf '100644 blob %s\tdonation-status.json\n' "$blob" | git mktree)
          commit=$(git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit-tree "$tree" -m 'Update public donation data')
          git push --force-with-lease="$ref:$previous" origin "$commit:$ref"
