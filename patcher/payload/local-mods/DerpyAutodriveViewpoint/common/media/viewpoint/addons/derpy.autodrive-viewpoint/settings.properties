schemaVersion=1

firstPersonDisplay.type=choice
firstPersonDisplay.label=First-person display
firstPersonDisplay.default=Navigation HUD
firstPersonDisplay.apply=live
firstPersonDisplay.choices=Navigation HUD,Road Guidance,Both,Off

thirdPersonDisplay.type=choice
thirdPersonDisplay.label=Third-person display
thirdPersonDisplay.default=Road Guidance
thirdPersonDisplay.apply=live
thirdPersonDisplay.choices=Navigation HUD,Road Guidance,Both,Off

matchGreen.type=toggle
matchGreen.label=Match destination length to green trajectory
matchGreen.default=true
matchGreen.apply=live

